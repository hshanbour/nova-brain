<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nova Console</title>
  <link rel="stylesheet" href="/assets/console.css">
</head>
<body>
  <main>
    <section id="console" aria-label="Nova console"></section>
    <p id="requestError" role="alert"></p>
    <form id="composerForm">
      <label for="messageInput">Message</label>
      <textarea id="messageInput" rows="1" placeholder="Message Nova"></textarea>
      <div id="composerVoiceError" role="alert"></div>
      <span id="composerVoiceStatus" aria-live="polite">Microphone ready</span>
      <button id="voiceButton" class="composer-voice" type="button" data-voice-state="idle" aria-pressed="false" aria-describedby="composerVoiceStatus" aria-label="Dictate message">
        <span id="composerVoiceWaveform" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></span>
      </button>
      <button id="sendButton" type="submit">Send</button>
    </form>
    <label for="microphoneLanguage">Dictation language</label>
    <select id="microphoneLanguage"></select>
  </main>
  <script type="module" src="/assets/console.js"></script>
</body>
</html>
