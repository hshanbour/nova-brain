# Approved 21 November 2026. One private London machine; remote login defaults off.
app = "nova-sharp-cuts-fresha-executor"
primary_region = "lhr"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  FRESHA_OWNER_LOGIN_ENABLED = "false"

[[mounts]]
  source = "fresha_profile"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "2gb"

[[restart]]
  policy = "always"

# Deliberately no [http_service], public IP, autoscaling or second Machine.

